<!DOCTYPE html>
<html lang="en">
  <head>
    <script type="module" src="./extended_component_library.min.js"></script>
    <link href="./style.css" rel="stylesheet">
    <title>GMPX - Store Locator Sample App</title>
  </head>
  <body>
    <gmpx-api-loader key="YOUR_API_KEY"></gmpx-api-loader>
    <div id="error-banner" role="alert" hidden>
      <span>
        Couldn't load driving distances or directions. See the browser console
        for details.
      </span>
      <gmpx-icon-button id="dismiss-button">Dismiss</gmpx-icon-button>
    </div>
    <gmpx-store-locator feature-set="advanced" map-id="DEMO_MAP_ID">
    </gmpx-store-locator>
    <script src="./index.js"></script>
  </body>
</html>
